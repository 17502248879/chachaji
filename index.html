<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="&#33590;&#33590;&#26426;" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-v2.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192-v2.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" sizes="180x180" />
    <title>&#33590;&#33590;&#26426;</title>
    <script>
      /* iOS home-screen mode reports documentElement.clientHeight ~59px short; use innerHeight when it clearly does */
      (function () {
        try {
          if (navigator.standalone !== true) return;
          var desc = Object.getOwnPropertyDescriptor(Element.prototype, "clientHeight");
          if (!desc || !desc.get) return;
          window.__rawClientHeight = function () { return desc.get.call(document.documentElement); };
          Object.defineProperty(document.documentElement, "clientHeight", {
            configurable: true,
            get: function () {
              var real = desc.get.call(this), ih = window.innerHeight, vv = window.visualViewport;
              return vv && real < ih - 20 && Math.abs(vv.height - ih) <= 2 ? ih : real;
            }
          });
        } catch (e) {}
      })();
    </script>
    <style>
      /* iOS: keep the home page below the status bar */
      html body .phone:not(.pwa-home-layout-v1):not(.pwa-home-layout-v3) .cha-home {
        padding-top: calc(env(safe-area-inset-top, 0px) + 12px) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- TEMP DEBUG PANEL: remove this whole script block after diagnosing -->
    <script>
      (function () {
        var box;
        function probe(css) {
          var d = document.createElement("div");
          d.style.cssText = "position:fixed;left:0;top:0;width:1px;visibility:hidden;pointer-events:none;" + css;
          document.body.appendChild(d);
          var h = Math.round(d.getBoundingClientRect().height);
          d.remove();
          return h;
        }
        function span(sel) {
          var el = document.querySelector(sel);
          if (!el) return "-";
          var b = el.getBoundingClientRect();
          return Math.round(b.top) + "~" + Math.round(b.bottom);
        }
        function render() {
          try {
            if (!document.body) return;
            if (!box) {
              box = document.createElement("pre");
              box.style.cssText =
                "position:fixed;left:8px;right:8px;top:58%;z-index:99999;margin:0;padding:6px 8px;" +
                "font:10px/1.3 ui-monospace,Menlo,monospace;color:#7CFF9B;background:rgba(0,0,0,.78);" +
                "border-radius:8px;white-space:pre-wrap;word-break:break-all;pointer-events:none";
              document.body.appendChild(box);
            }
            var vv = window.visualViewport || {};
            var ph = document.querySelector(".phone");
            box.textContent = [
              "inner " + innerWidth + "x" + innerHeight + "  client " + document.documentElement.clientHeight + "  raw " + (window.__rawClientHeight ? window.__rawClientHeight() : "-"),
              "vv " + Math.round(vv.height || 0) + " off " + Math.round(vv.offsetTop || 0) + "  screen " + screen.height + "/" + screen.availHeight,
              "vh " + probe("height:100vh") + " dvh " + probe("height:100dvh") + " lvh " + probe("height:100lvh") + " svh " + probe("height:100svh"),
              "safe top " + probe("height:env(safe-area-inset-top,0px)") + " bottom " + probe("height:env(safe-area-inset-bottom,0px)"),
              "stage " + span(".stage") + "  phone " + span(".phone"),
              "home " + span(".cha-home") + "  dock " + span(".cha-dock"),
              "--app-vh " + getComputedStyle(document.documentElement).getPropertyValue("--app-viewport-height") + "  standalone " + navigator.standalone,
              "cls " + (ph ? ph.className.replace(/pwa-home-/g, "") : "-")
            ].join("\n");
          } catch (e) {}
        }
        setInterval(render, 700);
      })();
    </script>
  </body>
</html>
